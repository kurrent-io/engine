emit:
  - "@kurrent/typespec-engine-ts"
  - "@kurrent/typespec-engine-py"
  - "@kurrent/typespec-engine-go"
options:
  "@kurrent/typespec-engine-ts":
    emitter-output-dir: "{project-root}"
    out-file: "model.gen.ts"
  "@kurrent/typespec-engine-py":
    emitter-output-dir: "{project-root}/../relay"
    out-file: "model.py"
  "@kurrent/typespec-engine-go":
    emitter-output-dir: "{project-root}/../decider/model"
    package: "model"
    out-file: "model.go"
